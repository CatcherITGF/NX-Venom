name: "atmosphere"
display_name: "Atmosphere"
enabled: true
category: "Core"
source:
  type: "github-release"
  repo: "Atmosphere-NX/Atmosphere"
  release: "latest"
assets:
  - pattern: "atmosphere-*.zip"
    type: "zip"
  - pattern: "fusee.bin"
    type: "file"
install:
  mappings:
    - asset: "atmosphere-*.zip"
      from: "atmosphere/"
      to: "Sources/NXVenom/atmosphere/"
      mode: "overwrite"
      exclude:
        - "config/**"
        - "config_templates/**"
        - "hosts/**"
        - "kips/**"
    - asset: "atmosphere-*.zip"
      from: "hbmenu.nro"
      to: "Sources/NXVenom/hbmenu.nro"
      mode: "overwrite"
    - asset: "atmosphere-*.zip"
      from: "switch/daybreak.nro"
      to: "Sources/NXVenom/switch/daybreak/daybreak.nro"
      mode: "overwrite"
    - asset: "atmosphere-*.zip"
      from: "atmosphere/reboot_payload.bin"
      to: "Sources/NXVenom/switch/.packages/RAM Patch/Default/reboot_payload.bin"
      mode: "overwrite"
    - asset: "fusee.bin"
      from: "fusee.bin"
      to: "Sources/NXVenom/bootloader/payloads/fusee.bin"
      mode: "overwrite"
