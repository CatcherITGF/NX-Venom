name: "horizon-oc"
display_name: "Horizon OC"
aliases:
  - "hoc"
enabled: true
category: "Overclocking"
source:
  type: "github-release"
  repo: "Horizon-OC/Horizon-OC"
  release: "latest"
assets:
  - pattern: "dist_ext.zip"
    type: "zip"
install:
  transforms:
    - type: "replace-text"
      asset: "dist_ext.zip"
      path: "config/horizon-oc/lang/template.json"
      replacements:
        - old: "\"Compiling with minimal features\": \"\",\n}"
          new: "\"Compiling with minimal features\": \"\"\n}"
    - type: "replace-text"
      asset: "dist_ext.zip"
      path: "config/horizon-oc/lang/zh-cn.json"
      replacements:
        - old: "\"Latency Max\": \"延迟最高频率\"\n"
          new: "\"Latency Max\": \"延迟最高频率\",\n"
        - old: "\"Same\": \"相同\"\n"
          new: "\"Same\": \"相同\",\n"
        - old: "\"LCD\": \"屏幕\"\n"
          new: "\"LCD\": \"屏幕\",\n"
    - type: "patch-byte-copy"
      asset: "dist_ext.zip"
      from: "payload.bin"
      to: "nx-venom-generated/hocate_8gb.bin"
      offset: "0x122"
      expected: "0x00"
      value: "0x01"
  mappings:
    - asset: "dist_ext.zip"
      from: "."
      to: "Sources/NXVenom/"
      mode: "overwrite"
      exclude:
        - "README.md"
        - "atmosphere/kips/**"
        - "config/horizon-oc/lang/**"
        - "nx-venom-generated"
        - "nx-venom-generated/**"
    - asset: "dist_ext.zip"
      from: "config/horizon-oc/lang/"
      to: "Sources/NXVenom/config/horizon-oc/lang/"
      mode: "delete-before-copy"
    - asset: "dist_ext.zip"
      from: "atmosphere/kips/hoc.kip"
      to: "Sources/NXVenom/atmosphere/kips/hoc.kip"
      mode: "overwrite"
      allow_protected: true
    - asset: "dist_ext.zip"
      from: "payload.bin"
      to: "Sources/NXVenom/switch/.packages/RAM Patch/Default/payload.bin"
      mode: "overwrite"
    - asset: "dist_ext.zip"
      from: "bootloader/update.bin"
      to: "Sources/NXVenom/switch/.packages/RAM Patch/Default/update.bin"
      mode: "overwrite"
    - asset: "dist_ext.zip"
      from: "nx-venom-generated/hocate_8gb.bin"
      to: "Sources/NXVenom/switch/.packages/RAM Patch/8GB/payload.bin"
      mode: "overwrite"
