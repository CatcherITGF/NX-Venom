name: "horizon-oc"
display_name: "Horizon OC"
enabled: true
category: "Overclocking"
source:
  type: "github-release"
  repo: "Horizon-OC/Horizon-OC"
  release: "latest"
assets:
  - pattern: "dist.zip"
    type: "zip"
install:
  mappings:
    - asset: "dist.zip"
      from: "."
      to: "Sources/NXVenom/"
      mode: "overwrite"
      exclude:
        - "README.md"
        - "atmosphere/kips/**"
