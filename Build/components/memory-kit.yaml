name: "memory-kit"
display_name: "Memory Kit"
enabled: true
category: "Packages"
source:
  type: "github-release"
  repo: "ppkantorski/Memory-Kit"
  release: "latest"
assets:
  - pattern: "Memory.Kit.zip"
    type: "zip"
install:
  mappings:
    - asset: "Memory.Kit.zip"
      from: "switch/.packages/Memory Kit/"
      to: "Sources/NXVenom/switch/.packages/Memory Kit/"
      mode: "overwrite"
