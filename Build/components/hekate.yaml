name: "hekate"
display_name: "Hekate"
enabled: true
category: "Core"
source:
  type: "github-release"
  repo: "CTCaer/hekate"
  release: "latest"
assets:
  - pattern: "hekate_ctcaer_*_Nyx_*.zip"
    type: "zip"
  - pattern: "hekate_ctcaer_*[0-9].bin"
    type: "file"
  - pattern: "hekate_ctcaer_*__ram8GB.bin"
    type: "file"
install:
  mappings:
    - asset: "hekate_ctcaer_*_Nyx_*.zip"
      from: "bootloader/"
      to: "Sources/NXVenom/bootloader/"
      mode: "overwrite"
      exclude:
        - "hekate_ipl.ini"
        - "ini/**"
        - "payloads/**"
    - asset: "hekate_ctcaer_*[0-9].bin"
      from: "hekate_ctcaer_*[0-9].bin"
      to: "Sources/NXVenom/payload.bin"
      mode: "overwrite"
    - asset: "hekate_ctcaer_*[0-9].bin"
      from: "hekate_ctcaer_*[0-9].bin"
      to: "Sources/NXVenom/bootloader/update.bin"
      mode: "overwrite"
    - asset: "hekate_ctcaer_*[0-9].bin"
      from: "hekate_ctcaer_*[0-9].bin"
      to: "Sources/NXVenom/switch/.packages/RAM Patch/Default/payload.bin"
      mode: "overwrite"
    - asset: "hekate_ctcaer_*[0-9].bin"
      from: "hekate_ctcaer_*[0-9].bin"
      to: "Sources/NXVenom/switch/.packages/RAM Patch/Default/update.bin"
      mode: "overwrite"
    - asset: "hekate_ctcaer_*__ram8GB.bin"
      from: "hekate_ctcaer_*__ram8GB.bin"
      to: "Sources/NXVenom/switch/.packages/RAM Patch/8GB/payload.bin"
      mode: "overwrite"
