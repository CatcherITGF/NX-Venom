name: "hekate"
display_name: "Hekate"
enabled: true
category: "Core"
source:
  type: "github-release"
  repo: "CTCaer/hekate"
  release: "latest"
assets:
  - pattern: "hekate_ctcaer_*_Nyx_*.zip"
    type: "zip"
install:
  mappings:
    - asset: "hekate_ctcaer_*_Nyx_*.zip"
      from: "bootloader/"
      to: "Sources/NXVenom/bootloader/"
      mode: "overwrite"
      exclude:
        - "hekate_ipl.ini"
        - "ini/**"
        - "payloads/**"
        - "update.bin"
        - "sys/nyx.bin"
